<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Radio 105 - Live Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #f6f6f6;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 50px 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .player {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: inline-block;
    }
    audio {
      width: 100%;
      max-width: 350px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="player">
    <h1>🎧 Radio 105 in diretta</h1>
    <audio controls autoplay>
      <source src="http://icecast.unitedradio.it/Radio105.mp3" type="audio/mpeg">
      Il tuo browser non supporta l'audio HTML5.
    </audio>
  </div>
</body>
</html>
